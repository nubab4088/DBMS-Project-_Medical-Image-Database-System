<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDS Images</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-details {
            text-align: right;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .user-role {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }
        
        .logout-btn:hover {
            background: #c82333;
        }
        
        .admin-badge {
            background: #ffc107;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 10px;
        }
        .tab-btn {
            background: #e0e7ef;
            border: none;
            padding: 10px 24px;
            border-radius: 8px 8px 0 0;
            font-weight: 600;
            color: #333;
            margin-right: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: #4a90e2;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MIDS</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="images.html" class="active">Images</a>
            <a href="patients.html">Patients</a>
            <a href="doctors.html">Doctors</a>
            <a href="admin.html" id="adminLink" style="display: none;">Admin Panel</a>
        </nav>
    </div>
    <div class="main-content">
        <header>
            <h1>Browse Images</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <div class="user-details">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>
        <div style="margin-bottom: 20px;">
            <button id="originalTab" class="tab-btn active" onclick="showTab('original')">Original Images</button>
            <button id="processedTab" class="tab-btn" onclick="showTab('processed')">Processed Images</button>
        </div>
        <div class="card-container" id="image-container">
            <p id="loading">Loading images...</p>
        </div>
    </div>
    
    <script>
        let currentTab = 'original';
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            showTab('original');
        });
        
        async function checkAuth() {
            try {
                const response = await fetch('backend/auth.php?action=check');
                const data = await response.json();
                
                if (data.authenticated) {
                    displayUserInfo(data.user);
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        }
        
        function displayUserInfo(user) {
            // Display user info in header
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userRole').textContent = user.role;
            document.getElementById('userAvatar').textContent = user.name.charAt(0);
            document.getElementById('userInfo').style.display = 'flex';
            
            // Show admin panel link for admin users
            if (user.role === 'Admin') {
                document.getElementById('userRole').innerHTML = user.role + '<span class="admin-badge">Admin</span>';
                document.getElementById('adminLink').style.display = 'block';
            }
        }
        
        async function logout() {
            try {
                await fetch('backend/auth.php?action=logout');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }
        
        function showTab(tab) {
            currentTab = tab;
            document.getElementById('originalTab').classList.toggle('active', tab === 'original');
            document.getElementById('processedTab').classList.toggle('active', tab === 'processed');
            const container = document.getElementById('image-container');
            container.innerHTML = '<p id="loading">Loading images...</p>';
            if (tab === 'original') {
                loadImages();
            } else {
                loadProcessedImages();
            }
        }
        
        function loadImages() {
            fetch('backend/images.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(images => {
                    const container = document.getElementById('image-container');
                    const loadingIndicator = document.getElementById('loading');
                    
                    if (loadingIndicator) {
                        loadingIndicator.remove();
                    }

                    if (images.length === 0) {
                        container.innerHTML = '<p>No images found in the database.</p>';
                        return;
                    }

                    images.forEach(image => {
                        const card = document.createElement('div');
                        card.classList.add('image-card');
                        
                        card.innerHTML = `
                            <img src="${image.image_path}" alt="Image ID: ${image.image_id}" onerror="this.style.display='none'">
                            <p><strong>Patient:</strong> ${image.patient_name || 'N/A'}</p>
                            <p><strong>Doctor:</strong> ${image.doctor_name || 'N/A'}</p>
                            <p><strong>Department:</strong> ${image.department_name || 'N/A'}</p>
                            <p><strong>Subcategory:</strong> ${image.subcategory_name || 'N/A'}</p>
                            <p><strong>Description:</strong> ${image.description}</p>
                            <a href="process_image.php?image_id=${image.image_id}" class="process-btn">Process</a>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error fetching images:', error);
                    const container = document.getElementById('image-container');
                    container.innerHTML = `<p id="error">Error loading images.</p>`;
                });
        }
        
        function loadProcessedImages() {
            fetch('backend/processed_images.php')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(images => {
                    const container = document.getElementById('image-container');
                    const loadingIndicator = document.getElementById('loading');
                    if (loadingIndicator) loadingIndicator.remove();
                    if (images.length === 0) {
                        container.innerHTML = '<p>No processed images found in the database.</p>';
                        return;
                    }
                    images.forEach(image => {
                        const card = document.createElement('div');
                        card.classList.add('image-card');
                        card.innerHTML = `
                            <img src="${image.processed_path}" alt="Processed Image ID: ${image.processed_image_id}" onerror="this.style.display='none'">
                            <p><strong>Processing Type:</strong> ${image.processing_type || 'N/A'}</p>
                            <p><strong>Processed By:</strong> ${image.processed_by_name || 'N/A'}</p>
                            <p><strong>Processed At:</strong> ${image.processed_at || 'N/A'}</p>
                            <hr>
                            <p><strong>Original Image:</strong></p>
                            <img src="${image.original_image_path}" alt="Original Image" style="max-width: 100px; max-height: 100px;" onerror="this.style.display='none'">
                            <p><strong>Patient:</strong> ${image.patient_name || 'N/A'}</p>
                            <p><strong>Doctor:</strong> ${image.doctor_name || 'N/A'}</p>
                            <p><strong>Department:</strong> ${image.department_name || 'N/A'}</p>
                            <p><strong>Subcategory:</strong> ${image.subcategory_name || 'N/A'}</p>
                            <p><strong>Description:</strong> ${image.original_description || ''}</p>
                            <a href="process_image.php?image_id=${image.image_id}" class="process-btn">Process</a>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error fetching processed images:', error);
                    const container = document.getElementById('image-container');
                    container.innerHTML = `<p id="error">Error loading processed images.</p>`;
                });
        }
    </script>
</body>
</html>
