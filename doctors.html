<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDS Doctors</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-left: auto;
        }
        
        .user-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 16px;
        }
        
        .user-details {
            text-align: right;
        }
        
        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        .user-role {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s;
        }
        
        .logout-btn:hover {
            background: #c82333;
        }
        
        .admin-badge {
            background: #ffc107;
            color: #333;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 10px;
        }
        
        .access-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 10px;
        }
        
        .access-admin {
            background: #ffc107;
            color: #333;
        }
        
        .access-user {
            background: #6c757d;
            color: white;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>MIDS</h2>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="images.html">Images</a>
            <a href="patients.html">Patients</a>
            <a href="doctors.html" class="active">Doctors</a>
            <a href="admin.html" id="adminLink" style="display: none;">Admin Panel</a>
        </nav>
    </div>
    <div class="main-content">
        <header>
            <h1>Medical Staff</h1>
            <div class="user-info" id="userInfo" style="display: none;">
                <div class="user-details">
                    <div class="user-name" id="userName"></div>
                    <div class="user-role" id="userRole"></div>
                </div>
                <div class="user-avatar" id="userAvatar"></div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>
        <div class="card-container" id="doctor-container">
            <p id="loading">Loading doctors...</p>
        </div>
    </div>
    
    <script>
        // Check authentication on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadDoctors();
        });
        
        async function checkAuth() {
            try {
                const response = await fetch('backend/auth.php?action=check');
                const data = await response.json();
                
                if (data.authenticated) {
                    displayUserInfo(data.user);
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = 'login.html';
            }
        }
        
        function displayUserInfo(user) {
            // Display user info in header
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userRole').textContent = user.role;
            document.getElementById('userAvatar').textContent = user.name.charAt(0);
            document.getElementById('userInfo').style.display = 'flex';
            
            // Show admin panel link for admin users
            if (user.role === 'Admin') {
                document.getElementById('userRole').innerHTML = user.role + '<span class="admin-badge">Admin</span>';
                document.getElementById('adminLink').style.display = 'block';
            }
        }
        
        async function logout() {
            try {
                await fetch('backend/auth.php?action=logout');
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout failed:', error);
            }
        }
        
        function loadDoctors() {
            fetch('backend/doctors.php')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(doctors => {
                    const container = document.getElementById('doctor-container');
                    const loadingIndicator = document.getElementById('loading');
                    
                    if (loadingIndicator) {
                        loadingIndicator.remove();
                    }

                    if (doctors.length === 0) {
                        container.innerHTML = '<p>No doctors found in the database.</p>';
                        return;
                    }

                    doctors.forEach(doctor => {
                        const card = document.createElement('div');
                        card.classList.add('card');
                        
                        const accessClass = doctor.access_level === 'Admin' ? 'access-admin' : 'access-user';
                        
                        card.innerHTML = `
                            <h3>${doctor.name}</h3>
                            <p><strong>ID:</strong> ${doctor.doctor_id}</p>
                            <p><strong>Email:</strong> ${doctor.email}</p>
                            <p><strong>Department:</strong> ${doctor.department_name || 'N/A'}</p>
                            <p><strong>Access Level:</strong> 
                                <span class="access-badge ${accessClass}">${doctor.access_level}</span>
                            </p>
                            <p><strong>Joined:</strong> ${new Date(doctor.created_at).toLocaleDateString()}</p>
                        `;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error('Error fetching doctors:', error);
                    const container = document.getElementById('doctor-container');
                    container.innerHTML = `<p id="error">Error loading doctors.</p>`;
                });
        }
    </script>
</body>
</html>
